# ============================================================================
# your.domain.com —— 刷课进度查询页（OpenResty / 1Panel 版）
#
# 与 nginx.conf 等价，只是适配「Web 服务由 1Panel 管理、OpenResty 跑在
# Docker 容器里」的部署形态（host 网络模式，容器内的 127.0.0.1:8000
# 就是宿主机的刷课服务）。
#
# 部署位置：/opt/1panel/www/conf.d/your.domain.com.conf
# 重载：sudo docker exec 1Panel-openresty-XXXX openresty -s reload
#
# 证书由 certbot 签发（Let's Encrypt，自动续期），续期钩子见
# /etc/letsencrypt/renewal-hooks/deploy/chaoxing-reload.sh
#
# 改这里：把所有 your.domain.com 换成你自己的域名，
# 把 1Panel-openresty-XXXX 换成你容器名（docker ps 可查）。
# ============================================================================

server {
    listen 80 ;
    server_name your.domain.com ;
    # 证书续期的 HTTP-01 校验走这里，其余请求一律跳 HTTPS
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl ;
    http2 on ;
    server_name your.domain.com ;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/your.domain.com/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/your.domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;
    ssl_prefer_server_ciphers off;

    access_log /www/sites/your.domain.com/log/access.log main;
    error_log /www/sites/your.domain.com/log/error.log;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # SSE 实时通道：与 nginx.conf 保持同样的口径 —— **必须关掉缓冲**，
    # 否则事件被攒着一起发，前端表现为"日志几秒才蹦一条"。
    location /api/events {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
        # 刷课是长任务（同步接口最多跑几分钟），超时要留够
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8000;
    }
}
