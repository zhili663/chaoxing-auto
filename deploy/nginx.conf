# ============================================================================
# Nginx 反向代理（把公网 HTTPS 转到本机的应用）
#
# 用法（Ubuntu/Debian）：
#     sudo cp deploy/nginx.conf /etc/nginx/conf.d/chaoxing.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# 应用本身只监听 127.0.0.1:8000（不对公网暴露），前端产物由它同源托管，
# 所以这里只需要一个 location —— 不需要另配静态站点。
#
# 证书交给 certbot 自动追加（它会把这个 server 块改写成 80 → 443 跳转）：
#     sudo apt install -y certbot python3-certbot-nginx
#     sudo certbot --nginx -d your.domain.com
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;   # ← 改成你的域名

    # 申请/续期证书时 Let's Encrypt 会来这个路径做校验
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # SSE 实时通道：**必须关掉缓冲**，否则事件会被 Nginx 攒着一起发，
    # 前端表现为"日志几秒才蹦一条"甚至一直不刷新。
    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;      # 长连接：客户端不断开就不该被切断
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 应用用它的第一段记录来源（审计日志里的 ip 字段）
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 刷课是长任务（同步接口最多跑几分钟），超时要留够
        proxy_read_timeout 300s;
        client_max_body_size 8m;
    }
}
