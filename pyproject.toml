[project]
name = "chaoxing"
version = "2.0.0.dev0"
description = "学习通刷课服务（v2：client / core / storage / api / cli 分层）"
authors = [
    { name = "chaoxing-auto contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "fonttools>=4.66.1",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "lxml>=6.1.3",
    "openai>=3.3.0",
    "orjson>=3.13.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=14.3.4",
    "sqlalchemy[aiosqlite,asyncio]>=2.1.3",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "svcs>=26.2.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

# 唯一允许人工维护的段落之一：uv 没有设置 entry point 的命令（见 docs/REFACTOR_PLAN.md §4.1）
[project.scripts]
cx = "chaoxing.cli.main:main"

# 浏览器相关能力（抓包 / 网页测试）由 orca-cli 提供，不在本项目里自带浏览器驱动
# （见 docs/REFACTOR_PLAN.md §5.14 与 docs/PROTOCOL_COVERAGE.md）。
[project.optional-dependencies]
ocr = [
    "ddddocr>=1.6.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

# --------------------------------------------------------------------------- #
# 工具配置（uv 没有对应命令，属于允许人工维护的段落，见 docs/REFACTOR_PLAN.md §4.1）
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# legacy 代码已整体归档到 legacy/（P7 删除），不再纳入新规范检查。
extend-exclude = [".venv", ".tools", "data", "deploy", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "T20", "PTH"]
ignore = [
    "E501",    # 行宽由 formatter 负责
    "RUF001",  # 中文全角标点在纯中文项目里是噪音（，：（））
    "RUF002",
    "RUF003",
    # 异常命名不加 Error 后缀：语义已由基类 ChaoxingError 承担，
    # RequestBlocked / HumanRequired 这类名字比加后缀更短也更清楚。
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PTH"]
"scripts/**" = ["T20", "PTH"]
"src/chaoxing/cli/**" = ["T20"]  # CLI 用 rich 输出，允许少量 print 到 stdout

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就是"在默认值里调用函数"——这是框架约定的写法，
# 不是 B008 想拦的可变默认值陷阱（Depends 每次请求都会重新求值）。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "chaoxing.api.deps.require",
    "chaoxing.api.deps.auth_context",
    "chaoxing.api.deps.current_user",
    "chaoxing.api.deps.require_user",
    "chaoxing.api.deps.get_container",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = ["^tools/"]

[[tool.mypy.overrides]]
# 可选依赖（extra 里才装）：没装时 mypy 不该把整个门禁卡住
module = ["sse_starlette.*", "svcs.*", "instructor.*", "ddddocr.*", "rich.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: 需要真实账号/网络的用例（默认不跑，手动 -m live 才执行）",
]
